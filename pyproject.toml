[build-system]
requires = ["setuptools>=80.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flower-latent-diffusion-model"
description = "A PyTorch Latent Diffusion Model trained on the Oxford Flowers 102 Dataset"
requires-python = ">=3.12"
dependencies = ["torch","torchvision","numpy","matplotlib","pillow"]
readme = "README.md"

dynamic = ["version"]


[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
