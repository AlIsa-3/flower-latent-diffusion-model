[build-system]
requires = ["setuptools>=80.4.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-diffusion-model"
description = "Trying to create a diffusion model from scratch"
requires-python = ">=3.12"
dependencies = ["torch","torchvision","numpy","matplotlib","pillow","ipykernel"]
readme = "README.md"

dynamic = ["version"]


[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
